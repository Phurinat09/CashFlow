<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔒 ลืมรหัสผ่าน – CashFlow</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #eaf4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .reset-box {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .reset-box h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.8rem;
      color: #004d40;
    }

    .reset-box p {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #444;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      background-color: #009688;
      color: white;
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #00796b;
    }

    #message {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .back-link a {
      color: #009688;
      text-decoration: none;
      font-size: 1rem;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="reset-box">
    <h1>ลืมรหัสผ่าน?</h1>
    <p>กรุณากรอกอีเมลของคุณเพื่อรับลิงก์สำหรับรีเซ็ตรหัสผ่าน</p>

    <form id="resetForm">
      <input type="email" id="email" placeholder="อีเมลของคุณ" required>
      <button type="submit" id="resetBtn">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
    </form>

    <div id="message"></div>

    <div class="back-link">
      <a href="login.html">กลับสู่หน้าล็อกอิน</a> <!-- ลิงก์กลับไปที่หน้า login.html -->
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    // 🔧 กำหนดค่า Firebase config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyBjLBl1sEGgQLyng51rW25b434bJ0opVc4",
      authDomain: "myapplication-bd04c034.firebaseapp.com",
      projectId: "myapplication-bd04c034",
      storageBucket: "myapplication-bd04c034.appspot.com",
      messagingSenderId: "49782830313",
      appId: "1:49782830313:web:c81b5d86a937f22d296c78"
    };

    // เริ่มต้น Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const messageDiv = document.getElementById('message');

      if (!email) {
        messageDiv.textContent = "กรุณากรอกอีเมลที่ถูกต้อง";
        messageDiv.style.color = "red";
        return;
      }

      messageDiv.textContent = "กำลังส่งลิงก์รีเซ็ตรหัสผ่าน...";
      messageDiv.style.color = "blue";

      try {
        await auth.sendPasswordResetEmail(email);
        messageDiv.textContent = "ลิงก์รีเซ็ตรหัสผ่านถูกส่งไปยังอีเมลของคุณแล้ว!";
        messageDiv.style.color = "green";
      } catch (error) {
        messageDiv.textContent = "เกิดข้อผิดพลาด: " + error.message;
        messageDiv.style.color = "red";
      }
    });
  </script>

</body>
</html>
